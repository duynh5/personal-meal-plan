name: Rolling meal plan

on:
  schedule:
    - cron: "0 1 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Generate rolling plan
        run: node scripts/generate-meal-plan.mjs

      - name: Validate rolling plan
        run: node scripts/validate-plan.mjs

      - name: Run validator regression tests
        run: node --test scripts/*.test.mjs

      - name: Render Pages site
        run: node scripts/render-site.mjs

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No meal plan changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meal-plan.md meal-plan.json site
          git commit -m "feat: update rolling meal plan"
          git push
